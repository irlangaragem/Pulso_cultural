version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: pulsocultural-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: pulsocultural
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:6-alpine
    container_name: pulsocultural-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
