version: '3.8'

# Local-only stack. Secrets MUST come from .env (see .env.example for the
# required variables). The compose file does not provide fallbacks — the
# stack will refuse to start without them.

services:
  postgres:
    image: postgres:14-alpine
    container_name: pulsocultural-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-pulsocultural}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: pulsocultural-api
    ports:
      - "3333:3333"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pulsocultural}
      JWT_SECRET: ${JWT_SECRET:?required}
      CPF_SALT: ${CPF_SALT:?required}
      EMAIL_SALT: ${EMAIL_SALT:?required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?required-on-first-boot}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@mam.ba.gov.br}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:4173,http://localhost:8080}
      PILOT_MUSEUM_SLUG: ${PILOT_MUSEUM_SLUG:-mam-bahia}
      PORT: "3333"
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      - postgres
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    container_name: pulsocultural-web
    ports:
      - "8080:8080"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3333}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
